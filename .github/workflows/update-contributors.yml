name: Update Contributors Safe Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-contributors-safe
  cancel-in-progress: true

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safe status
        run: |
          echo "Scheduled contributor update is disabled."
          echo "This prevents repeated run failed events."
          echo "Run a real contributor update manually after checking secrets and scripts."
